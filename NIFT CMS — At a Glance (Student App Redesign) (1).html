<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NIFT CMS — At a Glance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --burgundy:#8F1D2C;
    --burgundy-dark:#35171C;
    --bg:#F7F4EF;
    --surface:#FFFFFF;
    --text:#202020;
    --text-secondary:#6B6B6B;
    --border:#E5E1DC;
    --gold:#B89A5A;
    --success:#3E7B5B;
    --warning:#C28B2C;
    --error:#B3261E;
    --font-display:'Fraunces', Georgia, serif;
    --font-ui:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0;
    min-height:100%;
    background:#EBE6DC;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(143,29,44,0.05), transparent 45%),
      radial-gradient(circle at 85% 92%, rgba(184,154,90,0.08), transparent 40%);
    font-family:var(--font-ui);
    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:40px 16px 64px;
  }

  /* ---------- Presentation chrome (outside the phone) ---------- */
  .rig-header{
    width:100%;
    max-width:1180px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:24px;
    margin-bottom:28px;
    padding:0 4px;
    flex-wrap:wrap;
  }
  .rig-header .eyebrow{
    font-size:11px;
    letter-spacing:.08em;
    color:var(--burgundy);
    font-weight:700;
    margin:0 0 6px;
  }
  .rig-header h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:30px;
    margin:0;
    color:var(--burgundy-dark);
    letter-spacing:-.01em;
  }
  .rig-header p{
    margin:6px 0 0;
    color:var(--text-secondary);
    font-size:14px;
    max-width:46ch;
    line-height:1.5;
  }
  .rig-nav{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    max-width:560px;
  }
  .rig-nav button{
    font-family:var(--font-ui);
    font-size:12.5px;
    font-weight:600;
    color:var(--text-secondary);
    background:#fff;
    border:1px solid var(--border);
    border-radius:20px;
    padding:7px 13px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .rig-nav button:hover{ border-color:var(--burgundy); color:var(--burgundy); }
  .rig-nav button.active{ background:var(--burgundy); border-color:var(--burgundy); color:#fff; }

  .rig-stage{
    display:flex;
    align-items:flex-start;
    gap:28px;
  }

  /* ---------- Phone frame ---------- */
  .device{
    width:390px;
    height:844px;
    background:#0d0d0d;
    border-radius:52px;
    padding:14px;
    box-shadow:0 30px 60px -20px rgba(53,23,28,0.35), 0 2px 8px rgba(0,0,0,0.15);
    position:relative;
    flex-shrink:0;
  }
  .device::after{
    content:'';
    position:absolute;
    top:14px; left:50%; transform:translateX(-50%);
    width:120px; height:26px;
    background:#0d0d0d;
    border-radius:0 0 16px 16px;
    z-index:50;
  }
  .screen-frame{
    width:100%;
    height:100%;
    background:var(--bg);
    border-radius:38px;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .statusbar{
    height:47px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px 0 24px;
    font-size:14px;
    font-weight:700;
    color:var(--text);
    background:transparent;
    position:relative;
    z-index:40;
  }
  .statusbar .icons{ display:flex; align-items:center; gap:5px; }

  .app-body{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    -ms-overflow-style:none;
    scrollbar-width:none;
    position:relative;
  }
  .app-body::-webkit-scrollbar{ display:none; }

  .screen{ display:none; min-height:100%; flex-direction:column; }
  .screen.active{ display:flex; }

  .content-pad{ padding:4px 20px 28px; }

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    flex-shrink:0;
    display:flex;
    justify-content:space-around;
    align-items:flex-start;
    padding:9px 6px calc(9px + env(safe-area-inset-bottom,0px));
    background:rgba(247,244,239,0.94);
    backdrop-filter:blur(14px);
    border-top:1px solid var(--border);
  }
  .nav-item{
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    width:64px;
    padding:4px 0;
    cursor:pointer;
    color:var(--text-secondary);
    font-family:var(--font-ui);
  }
  .nav-item svg{ width:22px; height:22px; }
  .nav-item span{ font-size:10.5px; font-weight:600; letter-spacing:.01em; }
  .nav-item.selected{ color:var(--burgundy); }
  .nav-item.selected svg{ stroke:var(--burgundy); }

  /* ---------- Sub-screen header ---------- */
  .sub-header{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:12px;
    padding:18px 20px 14px;
  }
  .back-btn{
    width:36px; height:36px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .back-btn svg{ width:18px; height:18px; }
  .sub-header h1{
    font-family:var(--font-ui);
    font-size:20px;
    font-weight:700;
    margin:0;
    color:var(--text);
    letter-spacing:-.01em;
  }

  /* ---------- Typography helpers ---------- */
  .section-title{
    font-size:12px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-secondary);
    margin:0 0 10px;
  }
  .page-title{
    font-family:var(--font-ui);
    font-size:24px;
    font-weight:700;
    margin:2px 0 4px;
    letter-spacing:-.01em;
  }
  .page-sub{
    font-size:14px;
    color:var(--text-secondary);
    margin:0 0 22px;
    line-height:1.5;
  }

  /* ---------- Cards / components ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
  }
  .tap{ cursor:pointer; transition:transform .12s ease, border-color .12s ease; }
  .tap:active{ transform:scale(0.98); }

  .stack{ display:flex; flex-direction:column; gap:12px; }
  .row-between{ display:flex; align-items:center; justify-content:space-between; }

  /* Home header */
  .home-header{ padding:22px 20px 6px; display:flex; justify-content:space-between; align-items:flex-start; }
  .greeting-eyebrow{ font-size:13px; color:var(--text-secondary); font-weight:600; margin:0 0 2px; }
  .greeting-name{ font-family:var(--font-display); font-size:30px; font-weight:600; margin:0; color:var(--burgundy-dark); letter-spacing:-.01em; }
  .greeting-meta{ font-size:13.5px; color:var(--text-secondary); margin:6px 0 0; }
  .avatar{
    width:44px; height:44px; border-radius:50%;
    background:linear-gradient(135deg,#8F1D2C,#B89A5A);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:var(--font-display); font-weight:600; font-size:17px;
    flex-shrink:0; cursor:pointer; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.08);
  }
  .bell-btn{
    width:40px; height:40px; border-radius:50%; background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; flex-shrink:0;
  }
  .bell-dot{ position:absolute; top:9px; right:10px; width:7px; height:7px; border-radius:50%; background:var(--burgundy); border:1.5px solid var(--surface); }

  .schedule-card{ padding:16px; display:flex; flex-direction:column; gap:14px; }
  .schedule-item{ display:flex; gap:14px; align-items:flex-start; }
  .schedule-time{ font-family:var(--font-ui); font-size:12.5px; font-weight:700; color:var(--burgundy); width:64px; flex-shrink:0; padding-top:2px; }
  .schedule-divider{ width:1px; align-self:stretch; background:var(--border); margin-top:2px; }
  .schedule-main{ flex:1; }
  .schedule-course{ font-size:15px; font-weight:700; margin:0 0 3px; letter-spacing:-.005em; }
  .schedule-room{ font-size:13px; color:var(--text-secondary); margin:0; }
  .link-btn{
    background:none; border:none; color:var(--burgundy); font-family:var(--font-ui); font-weight:700; font-size:13px;
    padding:0; cursor:pointer; display:inline-flex; align-items:center; gap:4px;
  }
  .link-btn svg{ width:14px; height:14px; }

  .stat-row{ display:flex; gap:10px; }
  .stat-card{ flex:1; padding:14px 12px; text-align:left; }
  .stat-label{ font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-secondary); margin:0 0 6px; }
  .stat-value{ font-family:var(--font-display); font-size:26px; font-weight:600; margin:0; color:var(--text); }
  .stat-value.accent{ color:var(--burgundy); }

  .priority-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:3px solid var(--burgundy);
    border-radius:14px;
    padding:16px;
  }
  .priority-title{ font-size:15.5px; font-weight:700; margin:0 0 3px; }
  .priority-sub{ font-size:13.5px; color:var(--text-secondary); margin:0 0 12px; }
  .priority-meta-row{ display:flex; align-items:center; justify-content:space-between; }
  .badge{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:20px;
  }
  .badge-urgent{ background:rgba(179,38,30,0.09); color:var(--error); }
  .badge-upcoming{ background:rgba(184,154,90,0.14); color:#8a6f2f; }
  .badge-success{ background:rgba(62,123,91,0.1); color:var(--success); }
  .badge-neutral{ background:#F0EEE9; color:var(--text-secondary); }

  .calendar-note-card{ padding:14px 16px; }
  .calendar-note-title{ font-size:14.5px; font-weight:700; margin:0 0 3px; }
  .calendar-note-sub{ font-size:13px; color:var(--text-secondary); margin:0 0 10px; }

  .quick-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .quick-item{ display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; }
  .quick-icon{
    width:52px; height:52px; border-radius:14px; background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
  }
  .quick-icon svg{ width:21px; height:21px; }
  .quick-label{ font-size:11px; font-weight:600; color:var(--text); text-align:center; }

  /* Academics hub / list cards */
  .hub-card{
    display:flex; align-items:center; gap:14px; padding:16px;
  }
  .hub-icon{
    width:44px; height:44px; border-radius:12px; background:#F5EDE0; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .hub-icon svg{ width:20px; height:20px; stroke:var(--burgundy); }
  .hub-text{ flex:1; min-width:0; }
  .hub-title{ font-size:15.5px; font-weight:700; margin:0 0 2px; }
  .hub-desc{ font-size:13px; color:var(--text-secondary); margin:0; line-height:1.4; }
  .chev{ flex-shrink:0; }
  .chev svg{ width:17px; height:17px; stroke:var(--text-secondary); }

  /* Attendance */
  .attendance-summary{ padding:22px 20px; text-align:center; }
  .ring-wrap{ position:relative; width:140px; height:140px; margin:6px auto 14px; }
  .ring-value{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring-value strong{ font-family:var(--font-display); font-size:34px; font-weight:600; }
  .ring-value span{ font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-secondary); font-weight:700; margin-top:2px; }

  .subject-row{ padding:14px 16px; }
  .subject-row .row-between{ margin-bottom:8px; }
  .subject-name{ font-size:14.5px; font-weight:700; }
  .subject-pct{ font-size:14px; font-weight:700; color:var(--burgundy); }
  .progress-track{ height:6px; border-radius:4px; background:#EFEBE4; overflow:hidden; }
  .progress-fill{ height:100%; border-radius:4px; background:var(--burgundy); }
  .footnote{ font-size:12px; color:var(--text-secondary); text-align:center; margin:18px 0 4px; line-height:1.5; }

  /* Assignments */
  .filter-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin-bottom:18px; }
  .filter-chip{
    flex-shrink:0; font-size:12.5px; font-weight:700; padding:8px 15px; border-radius:20px;
    background:var(--surface); border:1px solid var(--border); color:var(--text-secondary); cursor:pointer;
  }
  .filter-chip.active{ background:var(--burgundy); border-color:var(--burgundy); color:#fff; }

  .assignment-card{ padding:16px; }
  .assignment-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px; }
  .assignment-title{ font-size:15.5px; font-weight:700; margin:0 0 3px; }
  .assignment-sub{ font-size:13px; color:var(--text-secondary); margin:0; }
  .assignment-meta{ display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--text-secondary); margin-top:12px; padding-top:12px; border-top:1px solid var(--border); }
  .assignment-meta strong{ color:var(--text); font-weight:700; }

  /* Assignment details */
  .detail-kicker{ font-size:12.5px; font-weight:700; color:var(--burgundy); letter-spacing:.04em; text-transform:uppercase; margin:0 0 6px; }
  .detail-title{ font-family:var(--font-ui); font-size:23px; font-weight:700; margin:0 0 22px; letter-spacing:-.01em; }
  .detail-block{ margin-bottom:22px; }
  .detail-block h3{ font-size:12px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--text-secondary); margin:0 0 8px; }
  .detail-block p{ font-size:14.5px; line-height:1.6; margin:0; color:var(--text); }
  .topic-list{ display:flex; flex-direction:column; gap:8px; }
  .topic-item{ display:flex; align-items:center; gap:10px; font-size:14.5px; font-weight:600; padding:11px 14px; border:1px solid var(--border); border-radius:12px; background:var(--surface); }
  .topic-item svg{ width:16px; height:16px; stroke:var(--burgundy); flex-shrink:0; }
  .kv-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .kv-grid .kv h3{ margin:0 0 4px; }
  .kv-grid .kv p{ font-size:15px; font-weight:700; }
  .btn-primary{
    width:100%; padding:15px; border-radius:12px; background:var(--burgundy); color:#fff; border:none;
    font-family:var(--font-ui); font-weight:700; font-size:14.5px; cursor:pointer; margin-bottom:10px;
  }
  .btn-secondary{
    width:100%; padding:15px; border-radius:12px; background:transparent; color:var(--text); border:1px solid var(--border);
    font-family:var(--font-ui); font-weight:700; font-size:14.5px; cursor:pointer;
  }

  /* Notifications */
  .notif-item{ display:flex; gap:12px; padding:14px 16px; align-items:flex-start; position:relative; }
  .notif-dot{ width:8px; height:8px; border-radius:50%; background:var(--burgundy); margin-top:6px; flex-shrink:0; }
  .notif-dot.read{ background:transparent; }
  .notif-body{ flex:1; min-width:0; }
  .notif-top{ display:flex; justify-content:space-between; gap:8px; margin-bottom:2px; }
  .notif-cat{ font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--gold); }
  .notif-time{ font-size:11.5px; color:var(--text-secondary); flex-shrink:0; }
  .notif-title{ font-size:14.5px; font-weight:700; margin:0 0 2px; }
  .notif-summary{ font-size:13px; color:var(--text-secondary); margin:0; line-height:1.4; }
  .group-label{ font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--text-secondary); margin:18px 0 10px 2px; }
  .group-label:first-child{ margin-top:0; }

  /* Notification details */
  .nd-meta{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .nd-tag{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--burgundy); background:rgba(143,29,44,.08); padding:4px 10px; border-radius:20px; }
  .nd-date{ font-size:12px; color:var(--text-secondary); font-weight:600; }

  /* Calendar */
  .cal-card{ padding:18px 16px; }
  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .cal-month{ font-family:var(--font-ui); font-size:15px; font-weight:700; letter-spacing:.02em; }
  .cal-arrow{ width:30px; height:30px; border-radius:50%; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .cal-arrow svg{ width:14px; height:14px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
  .cal-dow{ font-size:10.5px; font-weight:700; color:var(--text-secondary); padding-bottom:6px; }
  .cal-day{ position:relative; font-size:13px; font-weight:600; padding:8px 0; border-radius:10px; color:var(--text); }
  .cal-day.muted{ color:#C9C3B8; }
  .cal-day.marked::after{ content:''; position:absolute; bottom:3px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--burgundy); }
  .cal-day.today{ background:var(--burgundy); color:#fff; font-weight:700; }
  .upcoming-row{ display:flex; gap:14px; align-items:center; padding:14px 16px; }
  .upcoming-date{ width:46px; flex-shrink:0; text-align:center; }
  .upcoming-date strong{ display:block; font-family:var(--font-display); font-size:19px; font-weight:600; color:var(--burgundy); line-height:1; }
  .upcoming-date span{ display:block; font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--text-secondary); margin-top:3px; }
  .upcoming-text strong{ display:block; font-size:14.5px; font-weight:700; margin-bottom:2px; }
  .upcoming-text span{ font-size:12.5px; color:var(--text-secondary); }

  /* Marks */
  .marks-summary{ padding:24px 20px; text-align:center; }
  .marks-summary .stat-value{ font-size:44px; }
  .marks-row{ display:flex; align-items:center; justify-content:space-between; padding:15px 16px; }
  .marks-row .subject-name{ font-weight:700; }
  .marks-badge{ font-family:var(--font-display); font-weight:600; font-size:18px; color:var(--burgundy); background:rgba(143,29,44,.06); padding:5px 12px; border-radius:10px; }

  /* Campus / editorial cards */
  .editorial-card{ padding:0; overflow:hidden; }
  .editorial-media{ height:96px; background:linear-gradient(120deg,#8F1D2C,#5c1420); position:relative; }
  .editorial-media.gold{ background:linear-gradient(120deg,#B89A5A,#8a6f2f); }
  .editorial-media.dark{ background:linear-gradient(120deg,#35171C,#1c0c0f); }
  .editorial-media.warm{ background:linear-gradient(120deg,#C9B79A,#B89A5A); }
  .editorial-media svg{ position:absolute; right:16px; bottom:14px; width:26px; height:26px; stroke:rgba(255,255,255,.85); }
  .editorial-text{ padding:14px 16px 16px; }

  /* Profile */
  .profile-top{ display:flex; flex-direction:column; align-items:center; padding:26px 20px 22px; text-align:center; }
  .profile-avatar{
    width:76px; height:76px; border-radius:50%; background:linear-gradient(135deg,#8F1D2C,#B89A5A);
    display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-display);
    font-size:26px; font-weight:600; margin-bottom:12px; border:3px solid #fff; box-shadow:0 4px 14px rgba(53,23,28,.14);
  }
  .profile-name{ font-family:var(--font-ui); font-size:19px; font-weight:800; margin:0 0 4px; letter-spacing:-.01em; }
  .profile-meta{ font-size:13.5px; color:var(--text-secondary); line-height:1.6; margin:0; }
  .info-row{ display:flex; justify-content:space-between; align-items:center; padding:13px 16px; }
  .info-label{ font-size:13.5px; color:var(--text-secondary); }
  .info-value{ font-size:13.5px; font-weight:700; color:var(--text); }
  .divider-row{ height:1px; background:var(--border); margin:0 16px; }

  .list-row{ display:flex; align-items:center; gap:13px; padding:15px 16px; }
  .list-row svg{ width:19px; height:19px; stroke:var(--text-secondary); flex-shrink:0; }
  .list-row span{ flex:1; font-size:14.5px; font-weight:600; }
  .logout-row span{ color:var(--error); }
  .logout-row svg{ stroke:var(--error); }

  /* Help & feedback */
  .help-card{ padding:16px; display:flex; align-items:flex-start; gap:14px; }

function renderCalendar(){
  const dow = ['S','M','T','W','T','F','S'];
  const startOffset = 5; // Aug 1 2026 is a Saturday
  const daysInMonth = 31;
  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-day muted"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const marked = MARKED_DAYS.includes(d);
    const isToday = d===21;
    cells += `<div class="cal-day ${marked?'marked':''} ${isToday?'today':''}">${d}</div>`;
  }
  return `
  ${subHeader('Academic Calendar')}
  <div class="content-pad">
    <div class="card cal-card">
      <div class="cal-nav">
        <div class="cal-arrow">${ic.chevronLeft}</div>
        <p class="cal-month">AUGUST 2026</p>
        <div class="cal-arrow">${ic.chevronRight}</div>
      </div>
      <div class="cal-grid">
        ${dow.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>
    <div style="height:24px"></div>
    <p class="section-title">Upcoming</p>
    <div class="stack">
      ${CALENDAR_UPCOMING.map(e=>`
        <div class="card upcoming-row tap" onclick="showToast('${e.title}')">
          <div class="upcoming-date"><strong>${e.day}</strong><span>${e.mon}</span></div>
          <div class="upcoming-text"><strong>${e.title}</strong><span>${e.sub}</span></div>
        </div>`).join('')}
    </div>
  </div>`;
}

const RENDERERS = {
  home: renderHome, academics: renderAcademics, attendance: renderAttendance,
  assignments: renderAssignments, 'assignment-details': renderAssignmentDetails,
  notifications: renderNotifications, 'notification-details': renderNotificationDetails,
  calendar: renderCalendar, marks: renderMarks, campus: renderCampus, services: renderServices,
  profile: renderProfile, 'academic-info': renderAcademicInfo, 'help-feedback': renderHelpFeedback,
  settings: renderSettings,
};

const TAB_IDS = TABS.map(t=>t.id);

function go(id, resetStack){
  if(TAB_IDS.includes(id) || resetStack){
    navStack = [id];
  } else {
    navStack.push(id);
  }
  render();
}
function goBack(){
  if(navStack.length>1) navStack.pop();
  render();
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

function render(){
  const current = navStack[navStack.length-1];
  const body = document.getElementById('appBody');
  body.innerHTML = RENDERERS[current]();
  body.scrollTop = 0;

  const nav = document.getElementById('bottomNav');
  const isTabScreen = TAB_IDS.includes(current);
  nav.style.display = isTabScreen ? 'flex' : 'none';
  nav.innerHTML = TABS.map(t=>`
    <button class="nav-item ${t.id===current?'selected':''}" onclick="go('${t.id}')">
      ${ic[t.icon]}<span>${t.label}</span>
    </button>`).join('');

  document.querySelectorAll('.rig-nav button').forEach(b=>{
    b.classList.toggle('active', b.dataset.id===current);
  });
}

/* Presentation rig nav (screen index) */
function jumpTo(id){
  navStack = TAB_IDS.includes(id) ? [id] : ['home', id];
  render();
}
const rigNav = document.getElementById('rigNav');
rigNav.innerHTML = RIG_SCREENS.map(([id,label])=>`<button data-id="${id}" onclick="jumpTo('${id}')">${label}</button>`).join('');

/* Clock */
function tickClock(){
  const d = new Date();
  let h = d.getHours()%12; if(h===0) h=12;
  const m = d.getMinutes().toString().padStart(2,'0');
  document.getElementById('clock').textContent = `${h}:${m}`;
}
tickClock(); setInterval(tickClock, 30000);

render();
</script>
